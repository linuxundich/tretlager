# Tretlager als Flatpak (docs/flatpak.md). Bauen auf tinytin: build-aux/flatpak/build.sh
id: de.linuxundich.Tretlager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PySide6 6.11 mit QtWebEngine (Anmeldefenster); Kirigami und Kirigami Addons bringt die KDE-Laufzeit.
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: tretlager
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
build-options:
  append-path: /usr/lib/sdk/mingw-w64/bin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # Wine und Zwift über XWayland (fallback-x11 gäbe X11 nicht frei, Wine nähme seinen Wayland-Treiber)
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # WoW64: ohne multiarch lässt die Sandbox keinen 32-Bit-Code zu, syswow64 bliebe leer
  - --allow=multiarch
  # Sensor-Bridge: Bluetooth LE über BlueZ, Ankündigung für Zwift über Avahi
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  # Zwift-Sitzung im Schlüsselbund, Hinweise, Zwift-Fenster maximieren (Plasma)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.KWin
  # XWayland-Skalierung für die DPI der Wine-Fenster (nur lesen)
  - --filesystem=xdg-config/kwinrc:ro
  - --env=PATH=/app/wine/bin:/app/bin:/usr/bin
modules:
  # Kirigami Addons (1.13.1, mit FormCard) und der Plasma-Stil sind schon in org.kde.Platform 6.11.

  - name: cabextract
    sources:
      - type: archive
        url: https://www.cabextract.org.uk/cabextract-1.11.tar.gz
        sha256: b5546db1155e4c718ff3d4b278573604f30dd64c3c5bfd4657cd089b823a3ac6

  # Signaturprüfung des Zwift-Installers
  - name: osslsigncode
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: archive
        url: https://github.com/mtrojnar/osslsigncode/archive/refs/tags/2.14.tar.gz
        sha256: 0f033fd6069387d2e489fbd2187e62f624764eb8c2758ee94e3e793e5150b5c5

  # bleak, dbus-fast, SecretStorage als feste Wheels (build-aux/flatpak/gen-python-deps.py)
  - python-deps.json

  # Wine aus den Quellen als WoW64 (64-Bit-Unix-Teil, 32-Bit-Windows-Code per mingw), wie das
  # WoW64-Flatpak von Flathub. Fertige Kron4ek-WoW64-Builds stürzten in jeder Flatpak-Laufzeit
  # beim Start ab (virtual_init, Code 139); die KDE-Laufzeit hat keine 32-Bit-Erweiterungen.
  - name: wine
    config-opts:
      - --prefix=/app/wine
      - --enable-archs=i386,x86_64
      - --disable-winemenubuilder
      - --disable-tests
    make-install-args:
      - LDCONFIG=/bin/true
      - UPDATE_DESKTOP_DATABASE=/bin/true
      - INSTALL_PROGRAM_FLAGS=-s
    cleanup:
      - /wine/include
      - /wine/share/man
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.x/wine-11.20.tar.xz
        sha256: eac8ca448f9c0087f963026b4dc276d1e2b7fbb64056edc093e59bbb7e56fe28

  - name: tretlager
    buildsystem: simple
    build-commands:
      - po/update.sh --build
      - |
        SITE=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base": "/app"}))')
        mkdir -p "$SITE" && cp -a tretlager "$SITE/"
        find "$SITE/tretlager" -name __pycache__ -prune -exec rm -rf {} +
      - printf '#!/bin/sh\nexec python3 -m tretlager.kde "$@"\n' > /app/bin/tretlager
      - printf '#!/bin/sh\nexec python3 -m tretlager.bridge "$@"\n' > /app/bin/tretlager-bridge
      - chmod 755 /app/bin/tretlager /app/bin/tretlager-bridge
      # Sensor-Bridge per D-Bus-Aktivierung: eigene Instanz, unabhängig vom Fenster
      - install -Dm644 build-aux/flatpak/de.linuxundich.Tretlager.Bridge.service -t /app/share/dbus-1/services/
      - install -Dm644 tretlager/data/icons/de.linuxundich.Tretlager.svg /app/share/icons/hicolor/scalable/apps/de.linuxundich.Tretlager.svg
      - |
        for d in de.linuxundich.Tretlager de.linuxundich.Tretlager.Zwift; do
          sed -e 's|^Exec=env PYTHONPATH=@LIBDIR@ /usr/bin/python3 -m tretlager.kde|Exec=tretlager|' data/$d.desktop.in > $d.desktop
          install -Dm644 $d.desktop -t /app/share/applications/
        done
      - install -Dm644 build-aux/flatpak/de.linuxundich.Tretlager.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: dir
        path: ../..
        skip: [dist, poc, .git, .pytest_cache, build-aux/flatpak/build-dir, build-aux/flatpak/repo,
               build-aux/flatpak/.flatpak-builder, tretlager/data/locale]
